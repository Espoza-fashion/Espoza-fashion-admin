/* ================================
   TOAST
================================ */

function toast(msg){

  const el = $("toast");

  if(!el) return;

  el.textContent = msg;

  el.classList.add("show");

  clearTimeout(el._t);

  el._t = setTimeout(
    () => el.classList.remove("show"),
    2800
  );

}


/* ================================
   SUPABASE QUERY HELPER
================================ */

async function q(query){

  const { data, error } = await query;

  if(error){
    console.error("Supabase error:", error);
    throw error;
  }

  return data;

}

/* ================================
   IMAGE UPLOAD
================================ */

async function uploadImage(
  file,
  folder
){

  if(!file){
    throw new Error(
      "لم يتم اختيار صورة."
    );
  }


  const ext =
    (
      file.name
      .split(".")
      .pop()
      ||
      "jpg"
    )
    .toLowerCase();


  const path =
    `${folder}/${Date.now()}-${crypto.randomUUID()}.${ext}`;


  await q(

    sb
      .storage
      .from(BUCKET)
      .upload(
        path,
        file,
        {
          cacheControl:"3600",
          upsert:false
        }
      )

  );


  const { data } =
    sb
      .storage
      .from(BUCKET)
      .getPublicUrl(path);


  if(!data?.publicUrl){

    throw new Error(
      "تعذر الحصول على رابط الصورة."
    );

  }


  return {

    image_url:
      data.publicUrl,

    storage_path:
      path

  };

}

/* ================================

================================ */

async function restoreSession(){

  showLogin();


  $("loginEmail").value =
    ADMIN_EMAIL;


  $("loginPassword").value =
    "";


  $("loginError").textContent =
    "";


  try{

    const {
      data,
      error
    } =
      await sb.auth.getSession();


    if(error)
      throw error;


    if(!data?.session)
      return;


    const admin =
      await isAdmin();


    if(admin){

      showApp();

    }else{

      await sb.auth.signOut();

      $("loginError").textContent =
        "هذا الحساب لا يملك صلاحية الإدارة.";

    }


  }catch(e){

    console.error(
      "restoreSession:",
      e
    );

  }

}


/* ================================

================================ */

$("loginForm");

       * مهم جدًا:

        return;

      errorBox.textContent =
        "";


      try{

        const email =
          emailInput

            .toLowerCase();


        const password =
          passwordInput.value;


        if(!email){

          throw new Error(

        } =
          await sb.auth.signInWithPassword({

            password

          throw error;


        if(!data?.session){

          throw new Error(
            "تم قبول البيانات لكن لم يتم إنشاء جلسة دخول."

/* ================================
   PRODUCTS
================================ */

async function loadProducts(){

  try{

    const rows =
      await q(

        sb
          .from("products")
          .select("*")
          .order(
            "created_at",
            {
              ascending:false
            }
          )

      );


    let imgs = [];


    if(rows.length){

      imgs =
        await q(

          sb
            .from("product_images")
            .select("*")
            .in(
              "product_id",
              rows.map(
                x => x.id
              )
            )
            .order("sort_order")

        );

    }


    products =
      rows.map(
        p => ({

          ...p,

          _image:
            p.image_url
            ||
            imgs.find(
              i =>
                String(i.product_id)
                ===
                String(p.id)
            )?.image_url
            ||
            PLACEHOLDER

        })
      );


    renderProducts();

    updateStats();


  }catch(e){

    console.error(
      "loadProducts:",
      e
    );

    toast(
      "خطأ تحميل المنتجات: "
      +
      (
        e?.message
        ||
        "خطأ غير معروف"
      )
    );

  }

}

/* ================================
   OPEN PRODUCT MODAL
================================ */

async function openProductModal(
  id = null
){

  $("productForm").reset();


  $("productActive").checked =
    true;


  $("productAvailable").checked =
    true;


  $("productOffer").checked =
    false;


  productImages = [];

  editProduct = null;


  $("productId").value = "";

  $("productImagesList")
    .innerHTML = "";


  $("productModalTitle")
    .textContent =
      id
      ?
      "تعديل المنتج"
      :
      "إضافة منتج";


  $("productModal")
    .classList.add("open");


  if(!id)
    return;


  try{

    const [
      p,
      imgs,
      sizes,
      colors
    ] =
      await Promise.all([

        q(

          sb
            .from("products")
            .select("*")
            .eq("id",id)
            .single()

        ),

        q(

          sb
            .from("product_images")
            .select("*")
            .eq("product_id",id)
            .order("sort_order")

        ),

        q(

          sb
            .from("product_sizes")
            .select("*")
            .eq("product_id",id)
            .order("sort_order")

        ),

        q(

          sb
            .from("product_colors")
            .select("*")
            .eq("product_id",id)
            .order("sort_order")

        )

      ]);


    editProduct = p;


    $("productId").value =
      p.id;


    $("productName").value =
      p.name || "";


    $("productSku").value =
      p.sku || "";


    $("productCategory").value =
      p.category || "dresses";


    $("productPrice").value =
      p.price ?? "";


    $("productOldPrice").value =
      p.old_price ?? "";


    $("productDescription").value =
      p.description || "";


    $("productOffer").checked =
      bool(
        p.is_offer,
        false
      );


    $("productAvailable").checked =
      bool(
        p.is_available,
        true
      );


    $("productActive").checked =
      bool(
        p.is_active,
        true
      );


    $("productSizes").value =
      sizes
        .map(
          x => x.size
        )
        .join(",");


    /*
     * نربط كل صورة باللون
     * الموجود لها في product_colors.
     */

    productImages =
      imgs.map(

        i => ({

          ...i,

          color:
            colors.find(
              c =>
                String(c.image_id)
                ===
                String(i.id)
            )?.color_name
            ||
            "",

          file:null

        })

      );


    /*
     * توافق مع المنتجات القديمة
     * التي قد يكون لديها image_url
     * بدون سجل في product_images.
     */

    if(
      !productImages.length
      &&
      p.image_url
    ){

      productImages = [

        {

          id:null,

          image_url:
            p.image_url,

          storage_path:null,

          color:"",

          file:null

        }

      ];

    }


    renderProductImages();


  }catch(e){

    console.error(
      "openProductModal:",
      e
    );

    toast(
      "تعذر فتح المنتج: "
      +
      (
        e?.message
        ||
        "خطأ غير معروف"
      )
    );

  }

}


/* ================================
   CLOSE PRODUCT MODAL
================================ */

function closeProductModal(){

  $("productModal")
    .classList.remove("open");


  /*
   * تحرير روابط الصور المؤقتة.
   */

  productImages.forEach(
    img => {

      if(
        img?.image_url
        ?.startsWith("blob:")
      ){

        try{

          URL.revokeObjectURL(
            img.image_url
          );

        }catch{}

      }

    }
  );


  productImages = [];

  editProduct = null;

}


/* ================================
   ADD PRODUCT IMAGES
================================ */

$("productImagesInput")
  .addEventListener(
    "change",
    e => {

      const files =
        Array.from(
          e.target.files || []
        );


      for(
        const file
        of files
      ){

        if(
          !file.type
            .startsWith("image/")
        ){

          continue;

        }


        productImages.push({

          id:null,

          image_url:
            URL.createObjectURL(
              file
            ),

          storage_path:null,

          color:"",

          file

        });

      }


      renderProductImages();


      /*
       * نسمح باختيار نفس الصورة
       * مرة أخرى إذا احتاج المستخدم.
       */

      e.target.value = "";

    }
  );


/* ================================
   RENDER PRODUCT IMAGES
================================ */

function renderProductImages(){

  $("productImagesList")
    .innerHTML =

      productImages
        .map(

          (img,i) => `

            <div class="image-editor">

              <img
                src="${esc(
                  img.image_url
                )}"
                onerror="
                  this.src='${PLACEHOLDER}'
                ">


              <div>

                <input
                  class="field"
                  placeholder="اسم اللون لهذه الصورة"
                  value="${esc(
                    img.color || ""
                  )}"
                  oninput="
                    productImages[${i}].color=this.value
                  ">


                <div class="tiny">

                  الصورة ${i + 1}

                </div>

              </div>


              <button
                type="button"
                class="btn btn-danger"
                onclick="
                  removeProductImage(${i})
                ">

                حذف

              </button>

            </div>

          `

        )
        .join("");

}


/* ================================
   REMOVE PRODUCT IMAGE
================================ */

function removeProductImage(i){

  const image =
    productImages[i];


  if(
    image
    &&
    image.image_url
    &&
    image.image_url
      .startsWith("blob:")
  ){

    try{

      URL.revokeObjectURL(
        image.image_url
      );

    }catch{}

  }


  productImages.splice(
    i,
    1
  );


  renderProductImages();

}


/* ================================
   SAVE PRODUCT
================================ */

$("productForm")
  .addEventListener(
    "submit",
    async e => {

      e.preventDefault();


      const btn =
        e.submitter
        ||
        $("productForm")
          .querySelector(
            'button[type="submit"]'
          );


      if(!btn)
        return;


      btn.disabled = true;

      btn.textContent =
        "جاري الحفظ...";


      try{

        /*
         * ID موجود عند التعديل،
         * وجديد عند الإضافة.
         */

        const id =
          editProduct?.id
          ||
          crypto.randomUUID();


        /* ==========================
           BASIC PRODUCT DATA
        ========================== */

        const priceRaw =
          $("productPrice")
            .value
            .trim();


        const oldPriceRaw =
          $("productOldPrice")
            .value
            .trim();


        const payload = {

          name:
            $("productName")
              .value
              .trim(),

          sku:
            $("productSku")
              .value
              .trim()
              ||
              null,

          category:
            $("productCategory")
              .value,

          price:
            Number(priceRaw),

          old_price:
            oldPriceRaw === ""
            ?
            null
            :
            Number(oldPriceRaw),

          description:
            $("productDescription")
              .value
              .trim(),

          is_offer:
            $("productOffer")
              .checked,

          is_available:
            $("productAvailable")
              .checked,

          is_active:
            $("productActive")
              .checked,

          updated_at:
            new Date()
              .toISOString()

        };


        /* ==========================
           VALIDATION
        ========================== */

        if(
          !payload.name
        ){

          throw new Error(
            "أدخلي اسم المنتج."
          );

        }


        if(
          priceRaw === ""
          ||
          !Number.isFinite(
            payload.price
          )
          ||
          payload.price < 0
        ){

          throw new Error(
            "تأكدي من السعر."
          );

        }


        if(
          payload.old_price !== null
          &&
          (
            !Number.isFinite(
              payload.old_price
            )
            ||
            payload.old_price < 0
          )
        ){

          throw new Error(
            "تأكدي من السعر القديم."
          );

        }


        if(
          payload.old_price !== null
          &&
          payload.old_price < payload.price
        ){

          throw new Error(
            "السعر القديم يجب أن يكون أكبر من أو يساوي السعر الحالي."
          );

        }


        if(
          ![
            "dresses",
            "sets",
            "offers"
          ].includes(
            payload.category
          )
        ){

          throw new Error(
            "اختاري تصنيفًا صحيحًا."
          );

        }


        /* ==========================
           SAVE PRODUCT
        ========================== */

        if(editProduct){

          await q(

            sb
              .from("products")
              .update(payload)
              .eq("id",id)

          );

        }else{

          await q(

            sb
              .from("products")
              .insert({

                id,

                ...payload

              })

          );

        }


        /* ==========================
           OLD IMAGES
        ========================== */

        const oldImgs =
          editProduct

          ?

          await q(

            sb
              .from("product_images")
              .select("*")
              .eq(
                "product_id",
                id
              )

          )

          :

          [];


        /*
         * أولًا نحذف روابط الألوان
         * والمقاسات والصور المرتبطة
         * حتى نعيد بناءها بشكل نظيف.
         */

        await q(

          sb
            .from("product_colors")
            .delete()
            .eq(
              "product_id",
              id
            )

        );


        await q(

          sb
            .from("product_sizes")
            .delete()
            .eq(
              "product_id",
              id
            )

        );


        await q(

          sb
            .from("product_images")
            .delete()
            .eq(
              "product_id",
              id
            )

        );


        /* ==========================
           UPLOAD / SAVE IMAGES
        ========================== */

        const saved = [];


        for(
          let i = 0;
          i < productImages.length;
          i++
        ){

          const original =
            productImages[i];


          let img =
            original;


          /*
           * الصورة الجديدة:
           * نرفعها إلى Storage.
           */

          if(img.file){

            const uploaded =
              await uploadImage(
                img.file,
                `products/${id}`
              );


            img = {

              ...img,

              ...uploaded

            };

          }


          /*
           * إذا لم يوجد رابط للصورة،
           * نتجاوزها.
           */

          if(!img.image_url)
            continue;


          const row =
            await q(

              sb
                .from("product_images")
                .insert({

                  product_id:
                    id,

                  image_url:
                    img.image_url,

                  storage_path:
                    img.storage_path
                    ||
                    null,

                  sort_order:
                    i

                })
                .select()
                .single()

            );


          saved.push({

            ...row,

            color:
              (img.color || "")
                .trim()

          });

        }


        /* ==========================
           SAVE COLORS
        ========================== */

        for(
          let i = 0;
          i < saved.length;
          i++
        ){

          if(
            saved[i].color
          ){

            await q(

              sb
                .from("product_colors")
                .insert({

                  product_id:
                    id,

                  image_id:
                    saved[i].id,

                  color_name:
                    saved[i].color,

                  sort_order:
                    i

                })

            );

          }

        }


        /* ==========================
           SAVE SIZES
        ========================== */

        const sizes = [

          ...new Set(

            $("productSizes")
              .value
              .split(
                /[,،\n]/
              )
              .map(
                x =>
                  x.trim()
              )
              .filter(Boolean)

          )

        ];


        for(
          let i = 0;
          i < sizes.length;
          i++
        ){

          await q(

            sb
              .from("product_sizes")
              .insert({

                product_id:
                  id,

                size:
                  sizes[i],

                sort_order:
                  i

              })

          );

        }


        /* ==========================
           MAIN PRODUCT IMAGE
        ========================== */

        const main =
          saved[0]?.image_url
          ||
          null;


        await q(

          sb
            .from("products")
            .update({

              image_url:
                main

            })
            .eq(
              "id",
              id
            )

        );


        /* ==========================
           DELETE UNUSED STORAGE FILES
        ========================== */

        const kept =
          new Set(

            saved
              .map(
                x =>
                  x.storage_path
              )
              .filter(Boolean)

          );


        for(
          const old
          of oldImgs
        ){

          if(
            old.storage_path
            &&
            !kept.has(
              old.storage_path
            )
          ){

            try{

              await q(

                sb
                  .storage
                  .from(BUCKET)
                  .remove([
                    old.storage_path
                  ])

              );

            }catch(storageError){

              /*
               * فشل حذف ملف قديم من Storage
               * لا يمنع حفظ المنتج.
               */

              console.warn(
                "Storage cleanup failed:",
                storageError
              );

            }

          }

        }


        /* ==========================
           SUCCESS
        ========================== */

        toast(

          editProduct
          ?
          "تم تعديل المنتج ✅"
          :
          "تم إضافة المنتج ✅"

        );


        closeProductModal();


        await loadProducts();


      }catch(err){

        console.error(
          "SAVE PRODUCT ERROR:",
          err
        );


        toast(

          "تعذر حفظ المنتج: "
          +
          (
            err?.message
            ||
            "حدث خطأ غير معروف."
          )

        );

      }finally{

        btn.disabled = false;

        btn.textContent =
          "حفظ المنتج";

      }

    }
  );

async function deleteProduct(id){

  const product =
    products.find(
      x =>
        String(x.id)
        ===
        String(id)
    );


  if(
    !product
  ){

    toast(
      "المنتج غير موجود."
    );

    return;

  }


  if(
    !confirm(
      `حذف المنتج ${product.name}؟`
    )
  ){

    return;

  }


  try{

    /*
     * إذا كان المنتج مرتبطًا بطلب،
     * لا نحذفه فعليًا حتى لا نكسر الطلب.
     */

    const linked =
      await q(

        sb
          .from("orders")
          .select("id")
          .eq(
            "product_id",
            id
          )
          .limit(1)

      );


    if(
      linked
      &&
      linked.length
    ){

      await q(

        sb
          .from("products")
          .update({

            is_active:false,

            is_available:false

          })
          .eq(
            "id",
            id
          )

      );


      toast(
        "المنتج مرتبط بطلبات، تم إخفاؤه بدل حذفه."
      );


      await loadProducts();

      return;

    }


    /*
     * نحصل على ملفات الصور قبل حذفها
     * حتى نستطيع حذفها من Storage.
     */

    const imgs =
      await q(

        sb
          .from("product_images")
          .select(
            "storage_path"
          )
          .eq(
            "product_id",
            id
          )

      );


    /*
     * حذف البيانات المرتبطة أولًا.
     */

    await q(

      sb
        .from("product_colors")
        .delete()
        .eq(
          "product_id",
          id
        )

    );


    await q(

      sb
        .from("product_sizes")
        .delete()
        .eq(
          "product_id",
          id
        )

    );


    await q(

      sb
        .from("product_images")
        .delete()
        .eq(
          "product_id",
          id
        )

    );


    /*
     * حذف المنتج نفسه.
     */

    await q(

      sb
        .from("products")
        .delete()
        .eq(
          "id",
          id
        )

    );


    /*
     * حذف الصور من Storage.
     */

    const paths =
      imgs
        .map(
          x =>
            x.storage_path
        )
        .filter(Boolean);


    if(paths.length){

      try{

        await q(

          sb
            .storage
            .from(BUCKET)
            .remove(paths)

        );

      }catch(storageError){

        console.warn(
          "Storage delete failed:",
          storageError
        );

      }

    }


    toast(
      "تم حذف المنتج ✅"
    );


    await loadProducts();


  }catch(e){

    console.error(
      "deleteProduct:",
      e
    );


    toast(
      "تعذر حذف المنتج: "
      +
      (
        e?.message
        ||
        "حدث خطأ غير معروف"
      )
    );

  }

}

async function changeOrderStatus(id,status){

  if(!id || !status) return;

  try{

    await q(
      sb
        .from("orders")
        .update({
          status: status
        })
        .eq("id",id)
    );

    // تحديث الطلب محليًا مباشرة
    const order = orders.find(o => String(o.id) === String(id));

    if(order){
      order.status = status;
    }

    toast("تم تحديث حالة الطلب ✅");

    renderOrders();
    updateStats();

  }catch(e){

    console.error("changeOrderStatus error:",e);

    toast(
      "تعذر تحديث حالة الطلب: " +
      (e.message || "خطأ غير معروف")
    );

    // إعادة الرسم في حال فشل التحديث
    renderOrders();
  }
}



async function deleteOrder(id){

  if(!id) return;

  const confirmed = confirm("هل أنت متأكد من حذف هذا الطلب؟");

  if(!confirmed) return;

  try{

    await q(
      sb
        .from("orders")
        .delete()
        .eq("id",id)
    );

    // حذف من المصفوفة مباشرة
    orders = orders.filter(
      o => String(o.id) !== String(id)
    );

    toast("تم حذف الطلب ✅");

    renderOrders();
    updateStats();

  }catch(e){

    console.error("deleteOrder error:",e);

    toast(
      "تعذر حذف الطلب: " +
      (e.message || "خطأ غير معروف")
    );
  }
}

async function addSlider(){

  try{

    const title =
      $("sliderTitle")?.value.trim() || "";

    const subtitle =
      $("sliderSubtitle")?.value.trim() || "";

    const sortOrder =
      Number($("sliderOrder")?.value || 0);

    const imageInput =
      $("sliderImage");


    if(!title){

      toast("اكتب عنوان السلايدر أولًا");

      return;
    }


    if(!imageInput || !imageInput.files.length){

      toast("اختر صورة للسلايدر أولًا");

      return;
    }


    const file =
      imageInput.files[0];


    const fileExt =
      file.name.split(".").pop()?.toLowerCase() || "jpg";


    const id =
      crypto.randomUUID();


    const path =
      `hero/${id}.${fileExt}`;


    const uploadResult =
      await sb.storage
        .from(BUCKET)
        .upload(
          path,
          file,
          {
            cacheControl:"3600",
            upsert:false,
            contentType:file.type || "image/jpeg"
          }
        );


    if(uploadResult.error){

      throw uploadResult.error;
    }


    const publicResult =
      sb.storage
        .from(BUCKET)
        .getPublicUrl(path);


    const imageUrl =
      publicResult?.data?.publicUrl || "";


    await q(
      sb
        .from("slider")
        .insert({
          id:id,
          title:title,
          subtitle:subtitle,
          image_url:imageUrl,
          sort_order:sortOrder,
          is_active:true
        })
    );


    toast("تمت إضافة السلايدر ✅");


    if($("sliderForm")){
      $("sliderForm").reset();
    }

    await loadSlider();


  }catch(e){

    console.error("addSlider error:",e);

    toast(
      "تعذر إضافة السلايدر: " +
      (e.message || "خطأ غير معروف")
    );
  }
}



async function deleteSlider(id){

  if(!id) return;


  const confirmed =
    confirm("هل أنت متأكد من حذف هذا السلايدر؟");


  if(!confirmed) return;


  try{

    const item =
      sliderItems.find(
        x => String(x.id) === String(id)
      );


    await q(
      sb
        .from("slider")
        .delete()
        .eq("id",id)
    );


    // محاولة حذف الصورة من التخزين
    if(item?.image_url){

      try{

        const marker =
          `/storage/v1/object/public/${BUCKET}/`;

        const index =
          item.image_url.indexOf(marker);

        if(index !== -1){

          const path =
            decodeURIComponent(
              item.image_url
                .substring(index + marker.length)
            );

          if(path){

            await sb.storage
              .from(BUCKET)
              .remove([path]);

          }
        }

      }catch(storageError){

        console.warn(
          "تعذر حذف صورة السلايدر من Storage:",
          storageError
        );

      }
    }


    sliderItems =
      sliderItems.filter(
        x => String(x.id) !== String(id)
      );


    toast("تم حذف السلايدر ✅");

    renderSlider();
    updateStats();


  }catch(e){

    console.error("deleteSlider error:",e);

    toast(
      "تعذر حذف السلايدر: " +
      (e.message || "خطأ غير معروف")
    );
  }
}

/* AUTH STATE */

sb.auth.onAuthStateChange(
  async function(event,session){

    console.log(
      "Auth event:",
      event
    );


    if(event === "SIGNED_OUT"){

      showLogin();

      return;
    }


    if(
      event === "SIGNED_IN" ||
      event === "INITIAL_SESSION" ||
      event === "TOKEN_REFRESHED"
    ){

      if(!session){

        showLogin();

        return;
      }


      try{

        const admin =
          await isAdmin();


        if(admin){

          showApp();

          await loadAll();

        }else{

          await sb.auth.signOut();

          showLogin();

          toast(
            "هذا الحساب ليس لديه صلاحية دخول لوحة التحكم"
          );
        }

      }catch(e){

        console.error(
          "Auth state admin check error:",
          e
        );

        showLogin();

      }

    }

  }
);
